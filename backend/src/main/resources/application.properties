server.address=127.0.0.1
server.port=${DOCTOR_PORT:8080}
server.error.include-message=never
spring.jackson.serialization.indent-output=false
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=32KB
doctor.data-directory=${DOCTOR_DATA_DIR:./data}
doctor.api-token=${DOCTOR_API_TOKEN:}
doctor.groq-key=${GROQ_API_KEY:}
doctor.groq-model=${GROQ_MODEL:openai/gpt-oss-20b}
doctor.github-token=${GITHUB_TOKEN:}
