# Local static analysis deployment. No Docker socket or host filesystem is mounted.
# Use native controller + a reviewed rootless Docker context for repository execution.
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DOCTOR_API_TOKEN: ${DOCTOR_API_TOKEN:?Run scripts/setup-local.sh first}
      DOCTOR_DATA_DIR: /app/data
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - '127.0.0.1:3000:3000'
    volumes: ['doctor-data:/app/data']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    network_mode: service:backend
    depends_on: [backend]
    environment:
      DOCTOR_API_TOKEN: ${DOCTOR_API_TOKEN:?Run scripts/setup-local.sh first}
      DOCTOR_BACKEND_URL: http://127.0.0.1:8080
      DOCTOR_FRONTEND_ORIGIN: http://127.0.0.1:3000
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
volumes:
  doctor-data:
